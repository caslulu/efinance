                - paragraph [ref=e97]: OAuth 2.0 é o protocolo padrão do setor para autorização. OAuth 2.0 se concentra na simplicidade do desenvolvedor do cliente, ao mesmo tempo em que fornece fluxos de autorização específicos para aplicativos da Web, aplicativos de desktop, telefones celulares e dispositivos de sala de estar. Esta especificação e suas extensões estão sendo desenvolvidas dentro do IETF OAuth Working Group.
                - heading "Como usamos nas APIs do InterLink direto para Como usamos nas APIs do Inter" [level=2] [ref=e98]:
