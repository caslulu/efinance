                - paragraph [ref=e100]: Para segurança dos nossos serviços, implementamos o protocolo OAuth2 para autorização das chamadas. Este protocolo utiliza as client credentials (clientId e clientSecret), obtidas no momento em que se cria uma integração, após baixar o certificado e a chave. No detalhe da integração você verá o valor das credenciais.
