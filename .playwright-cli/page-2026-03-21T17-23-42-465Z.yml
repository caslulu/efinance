          - generic [ref=e90]:
            - heading "Como criar uma integração?" [level=1] [ref=e92]
            - paragraph [ref=e93]: Depois de criar e ativar sua conta digital PJ Inter, você está apto a criar uma integração e usar nossas APIs. Neste processo, serão gerados o certificado mTLS e as credenciais OAuth associadas a ele.
            - list [ref=e94]:
              - listitem [ref=e95]:
                - paragraph [ref=e96]:
                  - text: Faça login no
                  - link "Internet Banking" [ref=e97] [cursor=pointer]:
                    - /url: https://contadigital.bancointer.com.br/?t=pj
                  - text: .
              - listitem [ref=e98]:
                - paragraph [ref=e99]: Navegue até a seção Soluções para sua empresa.
              - listitem [ref=e100]:
                - paragraph [ref=e101]: Clique no botão Nova integração.
            - img "nova-integracao"
            - list [ref=e102]:
              - listitem [ref=e103]: Insira um nome e descrição para sua integração para facilitar sua gestão, informando, por exemplo, o objetivo dela, quais funcionalidades habilitadas, etc.
            - img "nome_descricao"
            - list [ref=e104]:
              - listitem [ref=e105]: Selecione as contas correntes que esta operação poderá executar ações. Para integrações associadas a mais de uma conta corrente é obrigatório informar no cabeçalho da requisição http qual conta corrente será utilizada.
            - img "selecao_contas"
            - list [ref=e106]:
              - listitem [ref=e107]: Selecione uma ou mais permissões disponíveis de acordo com sua necessidade. Na primeira vez, você deverá ler e concordar com os termos de uso de cada API.
            - img "selecao_escopo"
            - list [ref=e108]:
              - listitem [ref=e109]:
                - paragraph [ref=e110]: Clique no botão Criar Integração para concluir.
              - listitem [ref=e111]:
                - paragraph [ref=e112]: Após a criação, você será direcionado à tela Gestão de Integrações, onde sua integração será exibida com o status " Novo". Expandindo os detalhes você poderá ver mais algumas informações sobre a integração, como quais permissões e as contas correntes que está associada. Nesta tela você encontrará o botão para baixar a chave e certificado, para serem utilizados em seus acessos às nossas APIs.
            - img "baixar_certificado"
            - list [ref=e113]:
              - listitem [ref=e114]:
                - paragraph [ref=e115]: Ao clicar em baixar a chave e certificado, as credenciais serão geradas e exibidas em um pop-up.
                - paragraph [ref=e116]:
                  - strong [ref=e117]: Salve o Client Secret e o Client Id, eles não serão mostrados novamente.
            - img "cliendid_secret"
            - paragraph [ref=e118]: A integração passará por um processo de validação, após alguns minutos o status será atualizado para Ativo e estará pronta para utilização.
            - generic [ref=e119]:
              - generic [ref=e120]:
                - img [ref=e122]
                - text: Tempo de Validade do Certificado
              - paragraph [ref=e125]: Nossos certificados têm um prazo de duração de 1 ano. Após esse tempo, uma nova integração deve ser gerada, ou uma existente deverá ser renovada, e emitir um novo certificado.
            - generic [ref=e126]:
              - generic [ref=e127]:
                - img [ref=e129]
                - text: Proteja sua conta!
              - paragraph [ref=e132]: O ClientId e o ClientSecret são credenciais privadas de acesso à sua conta e não devem ser compartilhadas em locais públicos. Em caso de descumprimento desta recomendação, sua integração poderá ser cancelada por motivos de segurança e será necessário a criação de uma nova.
