            - generic [ref=e90]:
              - heading "Autenticação mTLS" [level=1] [ref=e92]
              - heading "O que é mTLS?Link direto para O que é mTLS?" [level=2] [ref=e93]:
                - text: O que é mTLS?
                - link "Link direto para O que é mTLS?" [ref=e94] [cursor=pointer]:
                  - /url: "#o-que-é-mtls"
                  - text: "#"
              - paragraph [ref=e95]: O TLS mútuo, ou mTLS, é um método para autenticação mútua. O mTLS assegura que as partes em cada extremidade de uma conexão de rede são quem afirmam ser, verificando que ambas têm a chave privada correta. As informações dentro de seus respectivos certificados TLS fornecem a verificação adicional.
              - paragraph [ref=e96]: O mTLS é frequentemente usado em uma estrutura de segurança Zero Trust* para verificar usuários, dispositivos e servidores dentro de uma organização. Também pode ajudar a manter as APIs seguras.
              - paragraph [ref=e97]: "*Zero Trust significa que nenhum usuário, dispositivo ou tráfego de rede é confiável por padrão, uma abordagem que ajuda a eliminar muitas vulnerabilidades de segurança."
              - heading "Como o Inter usa o mTLS?Link direto para Como o Inter usa o mTLS?" [level=2] [ref=e98]:
                - text: Como o Inter usa o mTLS?
                - link "Link direto para Como o Inter usa o mTLS?" [ref=e99] [cursor=pointer]:
                  - /url: "#como-o-inter-usa-o-mtls"
                  - text: "#"
              - heading "1. Chave pública e privadaLink direto para 1. Chave pública e privada" [level=3] [ref=e100]:
                - text: 1. Chave pública e privada
                - link "Link direto para 1. Chave pública e privada" [ref=e101] [cursor=pointer]:
                  - /url: "#1-chave-pública-e-privada"
                  - text: "#"
              - paragraph [ref=e102]: A TLS trabalha utilizando uma técnica chamada criptografia de chave pública, que depende de um par de chaves — uma chave pública e uma chave privada.
              - paragraph [ref=e103]: Qualquer coisa criptografada com a chave pública pode ser descriptografada apenas com a chave privada.
              - paragraph [ref=e104]: Qualquer coisa criptografada com a chave privada pode ser descriptografada apenas com a chave pública.
              - paragraph [ref=e105]: Portanto, um servidor que descriptografa uma mensagem que foi criptografada com a chave pública prova que possui a chave privada. Qualquer pessoa pode visualizar a chave pública verificando o certificado TLS do domínio ou do servidor.
              - heading "2. Certificado TLSLink direto para 2. Certificado TLS" [level=3] [ref=e106]:
                - text: 2. Certificado TLS
                - link "Link direto para 2. Certificado TLS" [ref=e107] [cursor=pointer]:
                  - /url: "#2-certificado-tls"
                  - text: "#"
              - paragraph [ref=e108]: Um certificado TLS é um arquivo de dados que contém informações importantes para verificar a identidade de um servidor ou dispositivo, incluindo a chave pública, uma declaração de quem emitiu o certificado (os certificados TLS são emitidos por uma autoridade de certificação) e a data de expiração do certificado.
              - heading "3. Handshake TLSLink direto para 3. Handshake TLS" [level=3] [ref=e109]:
                - text: 3. Handshake TLS
                - link "Link direto para 3. Handshake TLS" [ref=e110] [cursor=pointer]:
                  - /url: "#3-handshake-tls"
                  - text: "#"
              - paragraph [ref=e111]: O handshake TLS é o processo de verificação do certificado TLS e da posse da chave privada pelo servidor. O handshake TLS também estabelece como a criptografia ocorrerá quando o handshake estiver concluído
