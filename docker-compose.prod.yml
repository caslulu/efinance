name: finance-pro

services:
  postgres:
    image: postgres:15-alpine
    container_name: finance_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Configure DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Configure DB_NAME}
    volumes:
      - finance_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:?Informe a imagem do backend}
    container_name: finance_backend_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      NODE_ENV: production
      PORT: "3000"
      FORCE_HTTPS: "true"
    # Also bypasses schema changes in the CMD of legacy images during rollback.
    command: ["node", "dist/src/main.js"]
    volumes:
      - finance_uploads_prod:/app/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(async r => { if (!r.ok || (await r.json()).message !== 'OK') process.exit(1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:?Informe a imagem do frontend}
    container_name: finance_frontend_prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:80"
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O - http://127.0.0.1/api/ | grep -q '\"message\":\"OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  finance_pgdata_prod:
  finance_uploads_prod:
