services:
  postgres:
    image: postgres:15
    container_name: finance_db_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-financeuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-financepass}
      POSTGRES_DB: ${DB_NAME:-financepro}
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-financeuser} -d ${DB_NAME:-financepro}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: finance_backend_local
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-financeuser}:${DB_PASSWORD:-financepass}@postgres:5432/${DB_NAME:-financepro}?schema=public
      NODE_ENV: development
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
      FORCE_HTTPS: "false"
      CHOKIDAR_USEPOLLING: "true"
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
    volumes:
      - ./backend:/app
      - backend_node_modules_local:/app/node_modules
      - uploads_local:/app/uploads
    ports:
      - "3000:3000"
    command: >
      sh -c "if [ ! -d node_modules/.bin ]; then npm ci; fi &&
      npx prisma generate &&
      npx prisma db push &&
      npm run start:dev"

  frontend:
    image: node:20-alpine
    container_name: finance_frontend_local
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:3000}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules_local:/app/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -c "if [ ! -d node_modules/.bin ]; then npm ci; fi &&
      npm run dev -- --host 0.0.0.0"

volumes:
  pgdata_local:
  backend_node_modules_local:
  frontend_node_modules_local:
  uploads_local:
